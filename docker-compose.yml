version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://heatpunks.org}
        - NEXT_PUBLIC_WEB3FORMS_CONTACT_ACCESS_KEY=${NEXT_PUBLIC_WEB3FORMS_CONTACT_ACCESS_KEY:-}
        - NEXT_PUBLIC_WEB3FORMS_WAITLIST_ACCESS_KEY=${NEXT_PUBLIC_WEB3FORMS_WAITLIST_ACCESS_KEY:-}
        - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL:-}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DISCOURSE_URL=${DISCOURSE_URL:-https://forum.heatpunks.org}
      - DISCOURSE_API_KEY=${DISCOURSE_API_KEY:-}
      - DISCOURSE_API_USERNAME=${DISCOURSE_API_USERNAME:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
